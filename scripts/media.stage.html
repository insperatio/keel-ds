<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url('MANROPE_URL') format('woff2');font-weight:200 800;font-display:block}
:root{
  --page:#060C13; --raised:#121921; --line:#222A34; --line2:#37414D;
  --fg:#F9FAFC; --fg2:#CED5DE; --fg3:#86909D;
  --accent:#5E99FD;
  --danger:#FFA59E; --danger-bg:#400C0C; --danger-border:#80161A;
  --ok:#7FD994;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:580px}
body{background:var(--page);font-family:'Manrope',Inter,sans-serif;color:var(--fg);
  display:flex;flex-direction:column;gap:14px;padding:22px 26px}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);
  font-size:13px;color:var(--fg3);letter-spacing:.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.bar .name{color:var(--fg2);font-weight:600}
code,.mono{font-family:'DejaVu Sans Mono',monospace;font-variant-ligatures:none}
#code{padding:12px 16px 14px;font-size:15px;line-height:1.62}
#code .ln{white-space:pre;color:var(--fg2)}
#code .k{color:var(--fg)}
#code .v{color:var(--accent)}
#code .hl{background:#17212c;border-radius:4px;box-shadow:0 0 0 1px var(--line2)}
#code .was{color:var(--danger);text-decoration:line-through;opacity:.8}
#code .now{color:var(--danger);font-weight:700}
.term{flex:1;display:flex;flex-direction:column}
#out{padding:12px 16px 16px;font-size:15px;line-height:1.56;flex:1;overflow:hidden}
#out div{white-space:pre-wrap;text-indent:-14px;padding-left:14px}
.p{color:var(--fg3)}
.p b{color:var(--ok);font-weight:400}
.cmd{color:var(--fg)}
.cur{display:inline-block;width:8px;height:17px;background:var(--accent);
  vertical-align:-3px;margin-left:1px}
.cur.off{opacity:0}
.hdr{color:var(--danger);font-weight:700}
.err{color:var(--danger)}
.warn{color:var(--fg3)}
.pass{color:var(--ok)}
.cap{position:absolute;left:26px;bottom:18px;font-size:14px;color:var(--fg3)}
</style></head>
<body>
  <div class="panel" id="codepanel">
    <div class="bar"><span class="dot"></span><span class="name">src/tokens/semantic/light.tokens.json</span></div>
    <div id="code" class="mono"></div>
  </div>
  <div class="panel term">
    <div class="bar"><span class="dot"></span><span class="name">keel-ds</span></div>
    <div id="out" class="mono"></div>
  </div>
<script>
const C = document.getElementById('code'), O = document.getElementById('out');
function codeHTML(mode){
  const head = `<div class="ln"><span class="k">"text"</span>: {</div>`
    + `<div class="ln">  <span class="k">"primary"</span>:   { "$value": <span class="v">"{color.neutral.900}"</span> },</div>`;
  let sec;
  if(mode==='before') sec = `<div class="ln hl">  <span class="k">"secondary"</span>: { "$value": <span class="v">"{color.neutral.600}"</span> },</div>`;
  else if(mode==='after') sec = `<div class="ln hl">  <span class="k">"secondary"</span>: { "$value": <span class="now">"{color.neutral.400}"</span> },</div>`;
  else sec = `<div class="ln hl">  <span class="k">"secondary"</span>: { "$value": <span class="v">"{color.neutral.600}"</span> },</div>`;
  const tail = `<div class="ln">  <span class="k">"tertiary"</span>:  { "$value": <span class="v">"{color.neutral.500}"</span> },</div>`;
  return head + sec + tail;
}
window.setState = function(s){
  C.innerHTML = codeHTML(s.code);
  let h = '';
  for(const l of s.lines){
    if(l.t==='cmd') h += `<div class="p">$ <span class="cmd">${l.text}</span>${l.cursor?'<span class="cur"></span>':''}</div>`;
    else if(l.t==='hdr') h += `<div class="hdr">${l.text}</div>`;
    else if(l.t==='err') h += `<div class="err">${l.text}</div>`;
    else if(l.t==='warn') h += `<div class="warn">${l.text}</div>`;
    else if(l.t==='pass') h += `<div class="pass">${l.text}</div>`;
    else if(l.t==='gap') h += `<div>&nbsp;</div>`;
  }
  O.innerHTML = h;
};
</script></body></html>
