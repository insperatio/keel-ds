<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; color: var(--figma-color-text); background: var(--figma-color-bg); }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: var(--figma-color-text-secondary); }
      button { width: 100%; padding: 8px 12px; margin-bottom: 8px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--figma-color-border-strong); background: var(--figma-color-bg); color: var(--figma-color-text); }
      button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
      button:focus-visible { outline: 2px solid var(--figma-color-border-brand-strong); outline-offset: 2px; }
      textarea { width: 100%; height: 160px; box-sizing: border-box; font: 11px/1.4 ui-monospace, monospace; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg-secondary); color: var(--figma-color-text); }
      #status { min-height: 20px; margin: 4px 0 8px; }
      .error { color: var(--figma-color-text-danger); }
    </style>
  </head>
  <body>
    <h1>Keel tokens</h1>
    <p>Built from the repo's token files. The repo is the source of truth.</p>
    <button class="primary" id="push">Update Figma from repo</button>
    <button id="export">Export Figma variables</button>
    <div id="status" role="status" aria-live="polite"></div>
    <label for="out" hidden>Exported JSON</label>
    <textarea id="out" readonly placeholder="Exported JSON appears here. Save it as figma-export.json, then run: npm run figma:diff -- figma-export.json"></textarea>
    <button id="download" hidden>Download figma-export.json</button>
    <script>
      const $ = (id) => document.getElementById(id)
      const status = (text, error) => { $('status').textContent = text; $('status').className = error ? 'error' : '' }
      $('push').onclick = () => { status('Updating…'); parent.postMessage({ pluginMessage: { type: 'push' } }, '*') }
      $('export').onclick = () => { status('Exporting…'); parent.postMessage({ pluginMessage: { type: 'export' } }, '*') }
      $('download').onclick = () => {
        const a = document.createElement('a')
        a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'application/json' }))
        a.download = 'figma-export.json'
        a.click()
      }
      onmessage = (e) => {
        const m = e.data.pluginMessage
        if (m.type === 'pushed') status(`Done: ${m.report.created} variables created, ${m.report.updated} updated, ${m.report.styles} styles synced.`)
        if (m.type === 'exported') { $('out').value = m.json; $('download').hidden = false; status('Exported. Save it and run npm run figma:diff.') }
        if (m.type === 'error') status(m.message, true)
      }
    </script>
  </body>
</html>
